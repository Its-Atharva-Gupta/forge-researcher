version: "2.0"
agent:
  name: "research-manager"
  role: "Principal Investigator & Research Orchestrator"
  description: "Guided Autonomy Research Harness powered by official Orchestra Research AI skills: orchestrating sandboxed ML evaluation, academic visualization, LaTeX drafting, and rigor auditing."
  skills: 
    - "autoresearch_manager"
    - "research_ideation"
  mcp_servers: 
    - "ArXivServer"
    - "ScholarServer"
    - "KaggleColabServer"
    - "LaTeXCompilerServer"
    - "ResearchLabServer"
  
  subagents:
    - name: "eval-worker"
      role: "Sandboxed ML Experiment Specialist"
      skills: 
        - "lm_evaluation_harness"
      mcp_servers: 
        - "KaggleColabServer"
        - "ResearchLabServer"
      sandbox:
        enabled: true
        timeout_seconds: 120
      approval_required: true
      
    - name: "plot-worker"
      role: "Academic Visualizer"
      skills: 
        - "academic_plotting"
      mcp_servers: 
        - "ResearchLabServer"
      
    - name: "write-worker"
      role: "Scientific LaTeX Author"
      skills: 
        - "ml_paper_writing"
      mcp_servers: 
        - "LaTeXCompilerServer"
        - "ArXivServer"
      
    - name: "rigor-worker"
      role: "Level-2 Scientific Rigor & Fact-Check Auditor"
      skills: 
        - "rigor_reviewer"
      mcp_servers: 
        - "LaTeXCompilerServer"

  approval_gates:
    - id: "gate_pre_compute"
      name: "Compute & Experiment Budget Authorization"
      trigger: "before_dispatch_eval_worker"
      description: "Pause and require human approval before launching training runs inside the sandbox."
      
    - id: "gate_pre_publish"
      name: "Final Manuscript Publication Authorization"
      trigger: "before_final_pdf_export"
      description: "Pause and require human approval after Level-2 rigor audit passes before finalizing PDF."
